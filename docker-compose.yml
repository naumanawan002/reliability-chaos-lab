version: '3.8'

services:
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    command: ["/usr/local/bin/order-service", "-port", ":8081", "-inventory-url", "http://inventory-service:8082"]
    depends_on:
      - inventory-service

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    command: ["/usr/local/bin/inventory-service", "-port", ":8082"]
